# ---------------------------------------------------------------------------
# Color variants (Mantine-style): expanded for every palette color `c`,
# producing --ray-<c>-filled, --ray-<c>-light, … with light-dark() values.
# Components use these for variant="filled|light|outline|subtle".
# ---------------------------------------------------------------------------

[variants.light]
filled = "{c.8}"
filled-hover = "{c.9}"
light = "{c.6 / 10%}"
light-hover = "{c.6 / 16%}"
light-color = "{c.9}"
outline = "{c.8}"
outline-hover = "{c.6 / 8%}"
contrast = "{white}"

[variants.dark]
filled = "{c.8}"
filled-hover = "{c.9}"
light = "{c.6 / 15%}"
light-hover = "{c.6 / 22%}"
light-color = "{c.3}"
outline = "{c.4}"
outline-hover = "{c.4 / 8%}"
contrast = "{white}"

# Per-color overrides. [variants.override.<c>] applies to both schemes;
# [variants.override-light.<c>] / [variants.override-dark.<c>] to one (and win).
# The AA checks of `tools/run.sh tokens` drive these values.

# Yellow: a light filled shade with dark text (white fails on every yellow).
[variants.override.yellow]
filled = "{yellow.5}"
filled-hover = "{yellow.6}"
contrast = "{black}"
# Orange, green, teal, cyan: their deepest shade (darkened where the palette
# stops short) so white text reaches AA, like the other colors.
[variants.override.orange]
filled = "color-mix(in srgb, {orange.9} 90%, {black})"
filled-hover = "color-mix(in srgb, {orange.9} 80%, {black})"
[variants.override.green]
filled = "color-mix(in srgb, {green.9} 90%, {black})"
filled-hover = "color-mix(in srgb, {green.9} 80%, {black})"
[variants.override.teal]
filled = "{teal.9}"
filled-hover = "color-mix(in srgb, {teal.9} 85%, {black})"
[variants.override.cyan]
filled = "{cyan.9}"
filled-hover = "color-mix(in srgb, {cyan.9} 85%, {black})"
[variants.override.red]
filled = "{red.9}"
filled-hover = "color-mix(in srgb, {red.9} 85%, {black})"

# Their text (on a light tint, or as outline text) needs to be darker than the
# palette goes.
[variants.override-light.yellow]
light-color = "color-mix(in srgb, {yellow.9} 62%, {black})"
outline = "{yellow.light-color}"
[variants.override-light.orange]
light-color = "color-mix(in srgb, {orange.9} 78%, {black})"
outline = "{orange.light-color}"
[variants.override-light.green]
light-color = "color-mix(in srgb, {green.9} 80%, {black})"
outline = "{green.light-color}"
[variants.override-light.teal]
light-color = "color-mix(in srgb, {teal.9} 90%, {black})"
outline = "{teal.light-color}"
[variants.override-light.cyan]
light-color = "color-mix(in srgb, {cyan.9} 90%, {black})"
outline = "{cyan.light-color}"
[variants.override-light.red]
light-color = "color-mix(in srgb, {red.9} 90%, {black})"

# Neutral ramps.
[variants.override.dark]
filled = "{dark.6}"
filled-hover = "{dark.7}"
# In the dark scheme "dark" inverts: a near-white fill with black text (a dark
# fill would melt into the page), tints of white for light/subtle.
[variants.override-dark.dark]
filled = "{gray.1}"
filled-hover = "{gray.3}"
contrast = "{black}"
light = "{gray.1 / 10%}"
light-hover = "{gray.1 / 16%}"
light-color = "{gray.1}"
outline = "{gray.3}"
outline-hover = "{gray.1 / 8%}"
[variants.override.gray]
filled = "{gray.7}"
filled-hover = "{gray.8}"

# ---------------------------------------------------------------------------
# Semantic tokens (shadcn-style). Each has a light and a dark value; the
# generator emits light-dark(light, dark), so the theme follows `color-scheme`
# (system by default, forced with data-theme="light|dark" on any element).
# ---------------------------------------------------------------------------

[semantic.background]
light = "{white}"
dark = "{dark.9}"
[semantic.foreground]
light = "{gray.9}"
dark = "{gray.1}"

[semantic.card]
light = "{white}"
dark = "{dark.8}"
[semantic.card-foreground]
light = "{gray.9}"
dark = "{gray.1}"

[semantic.popover]
light = "{white}"
dark = "{dark.8}"
[semantic.popover-foreground]
light = "{gray.9}"
dark = "{gray.1}"

# A semantic token with a single `value` is the same in both schemes (here it
# points at a variant token, which already carries its own light/dark values).
[semantic.primary]
value = "{primary.filled}"
[semantic.primary-hover]
value = "{primary.filled-hover}"
[semantic.primary-foreground]
value = "{primary.contrast}"

[semantic.secondary]
light = "{gray.1}"
dark = "{dark.6}"
[semantic.secondary-hover]
light = "{gray.2}"
dark = "{dark.5}"
[semantic.secondary-foreground]
light = "{gray.9}"
dark = "{gray.1}"

# variant="default" (buttons, icon buttons…): a quiet surface and a gentle
# hover. Dark: translucent white, so it sits on the page and on cards alike.
[semantic.default]
light = "{white}"
dark = "{white / 3%}"
[semantic.default-hover]
light = "{gray.1}"
dark = "{white / 7%}"

# A raised surface on a muted one: the active segment of a segmented control.
# Dark: lighter than its track (a darker "hole" would read as pressed in).
[semantic.raised]
light = "{white}"
dark = "{dark.4}"

# Muted surfaces (filled inputs, tiles, code): in dark, a step above the card
# so they stay visible on it.
[semantic.muted]
light = "{gray.0}"
dark = "{dark.6}"
# Secondary text (descriptions, placeholders, captions): clearly dimmer than
# foreground, still AA on background, card and muted.
[semantic.muted-foreground]
light = "color-mix(in srgb, {gray.7} 50%, {gray.6})"
dark = "color-mix(in srgb, {dark.1} 75%, {dark.2})"

[semantic.accent]
light = "{gray.1}"
dark = "{dark.6}"
[semantic.accent-foreground]
light = "{gray.9}"
dark = "{gray.1}"

[semantic.destructive]
value = "{red.filled}"
[semantic.destructive-hover]
value = "{red.filled-hover}"
[semantic.destructive-foreground]
light = "{white}"
dark = "{white}"

# Status colors as text on the page background.
[semantic.success]
light = "{green.light-color}"
dark = "{green.5}"
[semantic.warning]
light = "{yellow.light-color}"
dark = "{yellow.5}"
[semantic.info]
light = "{cyan.light-color}"
dark = "{cyan.4}"

[semantic.border]
light = "{gray.3}"
dark = "{dark.6}"
[semantic.input]
light = "{gray.4}"
dark = "{dark.5}"
[semantic.ring]
light = "{primary.6 / 55%}"
dark = "{primary.4 / 60%}"
# The backdrop of modal dialogs, drawers and the command palette: a light
# dim plus [overlay] blur (shadcn-style) — the blur, not the darkness, sets
# the dialog apart.
[semantic.overlay]
light = "{black / 10%}"
dark = "{black / 50%}"
# The outer border of what sits on the overlay: translucent, and the surfaces
# clip their background to the padding box, so the border tints whatever is
# behind it — always darker (light) or lighter (dark) than the dimmed page, a
# crisp edge instead of a halo.
[semantic.overlay-border]
light = "{black / 16%}"
dark = "{white / 14%}"
[semantic.selection]
light = "{primary.6 / 22%}"
dark = "{primary.4 / 30%}"

# ---------------------------------------------------------------------------
# Charts: a categorical palette for series (use them in order) and the
# chart chrome. ray-ds draws no charts: chartTheme() hands these, resolved
# for the current theme, to a chart library (see CHARTS.md).
# The build checks, in both schemes ([checks.chart]): each series color
# against the background (non-text contrast, WCAG 1.4.11), and that the
# colors stay apart — for normal vision and simulated color blindness.
# ---------------------------------------------------------------------------

[chart.1]
light = "{blue.6}"
dark = "{blue.5}"
[chart.2]
light = "{orange.8}"
dark = "{orange.6}"
[chart.3]
light = "{teal.8}"
dark = "{teal.5}"
[chart.4]
light = "{violet.6}"
dark = "{violet.5}"
[chart.5]
light = "{pink.6}"
dark = "{pink.5}"
[chart.6]
light = "color-mix(in srgb, {yellow.9} 70%, {green.9})"
dark = "{yellow.5}"
[chart.7]
light = "{cyan.9}"
dark = "{cyan.5}"
[chart.8]
light = "{gray.6}"
dark = "{gray.6}"

[chart.grid]
light = "{gray.2}"
dark = "{dark.6}"
[chart.axis]
value = "{muted-foreground}"
[chart.text]
value = "{foreground}"
[chart.tooltip]
value = "{popover}"
[chart.tooltip-text]
value = "{popover-foreground}"
[chart.tooltip-border]
value = "{border}"

# ---------------------------------------------------------------------------
# Code: syntax colors of highlighted code (the docs; any app showing code).
# Text on the muted background, checked for AA in [checks] aa.
# ---------------------------------------------------------------------------

# In dark, a deep near-black (#19191a) rather than the muted step: code
# reads as its own surface, between the page and the cards.
[code.background]
light = "{gray.0}"
dark = "#19191a"
[code.text]
value = "{foreground}"
[code.tag]
value = "{green.light-color}"
[code.attr]
value = "{violet.light-color}"
[code.string]
value = "{blue.light-color}"
[code.keyword]
value = "{pink.light-color}"
[code.number]
value = "{orange.light-color}"
[code.comment]
value = "{muted-foreground}"
[code.punctuation]
value = "{muted-foreground}"
[code.function]
value = "{indigo.light-color}"
[code.type]
value = "{teal.light-color}"
# Diff lines: the text color; their background is a tint of it.
[code.added]
value = "{green.light-color}"
[code.removed]
value = "{red.light-color}"

# ---------------------------------------------------------------------------
# Scales (scheme independent).
# ---------------------------------------------------------------------------

[font]
sans = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
mono = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'

[font-size]
xs = "0.75rem"
sm = "0.875rem"
md = "1rem"
lg = "1.125rem"
xl = "1.25rem"
2xl = "1.5rem"
3xl = "1.875rem"
4xl = "2.25rem"

[line-height]
tight = "1.25"
heading = "1.3"
xs = "1.4"
sm = "1.45"
md = "1.55"
lg = "1.6"
xl = "1.65"

[font-weight]
regular = "400"
medium = "500"
semibold = "600"
bold = "700"

# 4px grid. Named steps (xs…xl) are Mantine's and drive component padding/gaps.
[space]
0 = "0"
1 = "0.25rem"
2 = "0.5rem"
3 = "0.75rem"
4 = "1rem"
5 = "1.25rem"
6 = "1.5rem"
8 = "2rem"
10 = "2.5rem"
12 = "3rem"
16 = "4rem"
xs = "0.625rem"
sm = "0.75rem"
md = "1rem"
lg = "1.25rem"
xl = "2rem"

[radius]
xs = "0.125rem"
sm = "0.25rem"
md = "0.5rem"
lg = "1rem"
xl = "2rem"
full = "9999px"
default = "{radius.md}"

# Height of buttons, inputs, selects… by size.
[control-height]
xs = "1.875rem"
sm = "2.25rem"
md = "2.625rem"
lg = "3.125rem"
xl = "3.75rem"

[shadow]
xs = "0 1px 3px {black / 5%}, 0 1px 2px {black / 10%}"
sm = "0 1px 3px {black / 5%}, 0 10px 15px -5px {black / 5%}, 0 7px 7px -5px {black / 4%}"
md = "0 1px 3px {black / 5%}, 0 20px 25px -5px {black / 5%}, 0 10px 10px -5px {black / 4%}"
lg = "0 1px 3px {black / 5%}, 0 28px 23px -7px {black / 5%}, 0 12px 12px -7px {black / 4%}"
xl = "0 1px 3px {black / 5%}, 0 36px 28px -7px {black / 5%}, 0 17px 17px -7px {black / 4%}"

# variant="gradient" (buttons, badges): default colors and angle; per element
# with gradient="from to [deg]". White text: both ends are checked for AA.
[gradient]
from = "{indigo.8}"
to = "{violet.8}"
deg = "45deg"

# Blur of the page behind modal overlays (--ray-overlay-blur). "0px" turns it
# off; per subtree with the CSS variable, per element with overlay-blur="…".
[overlay]
blur = "4px"

[focus]
ring-width = "2px"
ring-offset = "2px"

[duration]
fast = "120ms"
base = "200ms"
slow = "300ms"

[easing]
standard = "cubic-bezier(0.2, 0, 0, 1)"
in = "cubic-bezier(0.3, 0, 1, 1)"
out = "cubic-bezier(0, 0, 0, 1)"

[z]
base = "0"
sticky = "200"
dropdown = "300"
overlay = "400"
modal = "500"
popover = "600"
toast = "700"
tooltip = "800"

# Exported to tokens.json only (see [meta] json_only): custom properties cannot
# be used inside @media.
[breakpoint]
xs = "36em"
sm = "48em"
md = "62em"
lg = "75em"
xl = "88em"
