# ray-ds design tokens — the single source of truth.
#
# Regenerate dist/tokens.css, dist/tokens.json and docs/foundations.html with:
#   tools/run.sh tokens
#
# Value syntax
#   "#fff", "1rem", "200ms"       literal CSS value
#   "{blue.6}"                    reference to another token  -> var(--ray-blue-6)
#   "{white}"                     reference to a top-level token -> var(--ray-white)
#   "{blue.6 / 15%}"              reference with alpha -> color-mix(in srgb, var(--ray-blue-6) 15%, transparent)
#   "{c.6}"                       inside [variants.*] only: the color being expanded
#   "{primary.6}"                 the primary color (see [meta] primary; runtime: data-primary="violet")
# References may appear anywhere inside a value ("0 1px 3px {black / 5%}").

[meta]
prefix = "ray"
primary = "blue"
json_only = ["breakpoint"]
# "custom": a color whose ten shades are set at runtime by definePrimary(color)
# (data-primary="custom"); without them it falls back to the primary's.
runtime_colors = ["custom"]

# WCAG AA (4.5:1) text/background pairs checked in both schemes by
# `tools/run.sh tokens` (the build fails if one does not pass).
# Every color's `contrast on filled` is checked too, as a warning.
[checks]
aa = [
    "foreground on background",
    "card-foreground on card",
    "popover-foreground on popover",
    "primary-foreground on primary",
    "secondary-foreground on secondary",
    "muted-foreground on muted",
    "muted-foreground on background",
    "accent-foreground on accent",
    "destructive-foreground on destructive",
    "success on background",
    "warning on background",
    "info on background",
    "white on gradient-from",
    "white on gradient-to",
    "code-text on code-background",
    "code-tag on code-background",
    "code-attr on code-background",
    "code-string on code-background",
    "code-keyword on code-background",
    "code-number on code-background",
    "code-comment on code-background",
    "code-function on code-background",
    "code-type on code-background",
    "code-added on code-background",
    "code-removed on code-background",
]

[checks.chart]
# Series tokens (chart-<n>), in display order.
series = ["1", "2", "3", "4", "5", "6", "7", "8"]
# Each series against the background, both schemes (WCAG 1.4.11): error below.
min_contrast = 3.0
# OKLab distance (x100) between any two series: error below.
min_distance = 10.0
# Same, between consecutive series (the ones charts use together most), under
# simulated protanopia, deuteranopia and tritanopia: warning below.
min_distance_cvd = 6.0

