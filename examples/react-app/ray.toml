[package]
name = "react-app"
version = "0.1.0"
raylang = "1.27.37"

[dependencies]

# The web frontend (Vite). `ray dev` runs `dev` and points app:// at `url`;
# `ray build --native` / `ray bundle` run `build` and embed `dist`.
[frontend]
dev = "npm --prefix frontend run dev -- --strictPort --port 45173 --clearScreen false"
url = "http://localhost:45173"
build = "npm --prefix frontend run build"
dist = "frontend/dist"
