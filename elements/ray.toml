[package]
name = "elements"
version = "0.5.1"
description = "ray-elements for raylang apps: the npm package @raylang/elements served to the app's pages by its npm name ([web] package) and the native bridge for std/ui windows (elements/bridge)"
license = "Apache-2.0"
raylang = "1.27.48"

# @raylang/elements, as published to npm: raylang serves it at
# ray://app/node_modules/@raylang/elements/ with an import map, bakes it into a
# native binary and links it into the app's node_modules/ for the editor.
[web]
package = "web"
