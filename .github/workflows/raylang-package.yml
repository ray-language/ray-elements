# The raylang package, published to its own repository.
#
# A git dependency (and the index) takes the root of a repository, so the
# ray_ds/ directory of this one lives in github.com/ray-language/ray_ds, at
# its root. On a version tag (v0.3.0…) this writes the package there with
# `ray run tools/src/main.ray raylang-package`, commits it and gives it the
# same tag; run it by hand (workflow_dispatch) to sync main without a tag.
#
# It pushes with a deploy key of ray_ds (write access), kept in this
# repository's secret RAY_DS_DEPLOY_KEY.

name: raylang-package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raylang-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The deploy key is set
        env:
          KEY: ${{ secrets.RAY_DS_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the secret RAY_DS_DEPLOY_KEY: the private half of a deploy key of ray-language/ray_ds with write access."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ray-language/ray_ds
          ssh-key: ${{ secrets.RAY_DS_DEPLOY_KEY }}
          path: ray_ds-repo
          fetch-depth: 0

      - name: Install raylang
        run: |
          curl -sSfL https://raylang.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The tag is the version of ray-ds.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ray-ds.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match ray-ds.toml's version ($version)."
            exit 1
          fi

      - name: Package tests
        working-directory: ray_ds
        run: ray test

      - name: Write the package
        run: ray run tools/src/main.ray raylang-package --out ray_ds-repo

      - name: Commit, tag and push
        working-directory: ray_ds-repo
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ray.toml)
          git config user.name "ray-ds release"
          git config user.email "ray-ds-release@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ray_ds is already up to date."
          else
            git commit -m "ray_ds $version (from ray-language/ray-ds@${GITHUB_SHA::7})"
          fi
          git push origin HEAD:main
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if git rev-parse -q --verify "refs/tags/$GITHUB_REF_NAME" >/dev/null; then
              echo "::error::ray_ds already has the tag $GITHUB_REF_NAME."
              exit 1
            fi
            git tag "$GITHUB_REF_NAME"
            git push origin "$GITHUB_REF_NAME"
          fi
