# The npm packages: @ray-ds/elements, @ray-ds/react and @ray-ds/vue.
#
# On a version tag (v0.3.0…) this checks that the tag is ray-ds.toml's
# version, runs the tool tests, regenerates packages/ and checks it matches
# what is committed, then publishes the three packages in order (elements
# first: react and vue depend on it). A version already on npm is skipped, so
# a failed run can be run again. A prerelease (0.4.0-rc.1) goes to the "next"
# dist-tag, anything else to "latest".
#
# Run it by hand (workflow_dispatch) for a dry run of the same steps from any
# branch; a real publish by hand must be run from the tag.
#
# Authentication: the secret NPM_TOKEN (a granular token with read and write
# on @ray-ds) when it is set; otherwise npm's trusted publishing, which needs
# each package on npmjs.com to trust this repository and this workflow file
# (a package must exist before it can trust a publisher, so the first
# release needs the token). Provenance is attached when the repository is
# public; npm refuses it from a private one.

name: npm-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: A real publish comes from a tag
        if: env.DRY_RUN != 'true' && github.ref_type != 'tag'
        run: |
          echo "::error::Publishing runs from a vX.Y.Z tag; run it by hand from the tag, or as a dry run."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Install raylang
        run: |
          curl -sSfL https://raylang.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The tag is the version of ray-ds.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ray-ds.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match ray-ds.toml's version ($version)."
            exit 1
          fi

      - name: Tool tests
        working-directory: tools
        run: ray test

      - name: The packages match the sources
        run: |
          ray run tools/src/main.ray build
          if ! git diff --quiet -- packages || [ -n "$(git status --porcelain -- packages)" ]; then
            echo "::error::packages/ differs from what the sources produce. Run 'ray run tools/src/main.ray build' and commit the result."
            git status --short -- packages
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLIC: ${{ !github.event.repository.private }}
        run: |
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          [ "$PUBLIC" = "true" ] && flags+=(--provenance)
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Authenticating with NPM_TOKEN."
          else
            echo "No NPM_TOKEN: trusted publishing."
          fi
          for dir in elements react vue; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm: skipped."
              continue
            fi
            echo "Publishing $name@$version to $tag$([ "$DRY_RUN" = "true" ] && echo " (dry run)")"
            (cd "packages/$dir" && npm publish --tag "$tag" "${flags[@]}")
          done
