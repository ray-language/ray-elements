# The docs site, built from the sources and published to GitHub Pages.
#
# Every push to main (and every pull request) builds it and checks that the
# committed output (docs/, packages/, dist/tokens.*, src/index.js) matches
# what the sources generate. Publishing is a second job, off until the repo
# variable PAGES_DEPLOY is "true" (Settings → Secrets and variables →
# Actions → Variables) and Pages uses "GitHub Actions" as its source.
#
# Only dist/site/ is published: `ray run tools/src/main.ray site` writes it.

name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install raylang
        run: |
          curl -sSfL https://raylang.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: ray --version

      - name: Tool tests
        working-directory: tools
        run: ray test

      # Served at /<repo>/ on GitHub Pages; a custom domain would be "/".
      - name: Build the site
        run: ray run tools/src/main.ray site --base "${PAGES_BASE:-/${{ github.event.repository.name }}/}"
        env:
          PAGES_BASE: ${{ vars.PAGES_BASE }}

      - name: Committed output matches the sources
        run: |
          if ! git diff --quiet -- docs packages dist src/index.js || [ -n "$(git status --porcelain -- docs packages dist src/index.js)" ]; then
            echo "::error::The generated files differ from what the sources produce. Run 'ray run tools/src/main.ray build' and commit the result."
            git status --short -- docs packages dist src/index.js
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
