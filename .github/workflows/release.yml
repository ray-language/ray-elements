# A release, on a version tag (v0.3.0…): one check, then two jobs.
#
#   check    the tag is ray-elements.toml's version, the tests pass, the committed
#            output matches the sources, and the site is built
#   npm      @raylang/elements, then @raylang/react and @raylang/vue
#   site     the site on GitHub Pages
#
# The raylang package (elements/) is not published from here: `ray registry
# mirror`, run from elements/ on a maintainer's machine, pushes it to
# github.com/ray-language/elements and to the index (CONTRIBUTING.md).
#
# Run it by hand (workflow_dispatch) for a dry run of the same jobs from any
# branch: npm publishes with --dry-run and the site is built but not deployed. A real release by hand must be run
# from the tag.
#
# Secrets and settings:
# - NPM_TOKEN: a granular token with read and write on @raylang. Without it,
#   npm's trusted publishing: each package on npmjs.com trusts this
#   repository and release.yml (a package must exist before it can trust a
#   publisher, so the first release needs the token). Provenance is attached
#   when this repository is public; npm refuses it from a private one.
# - The site deploys when the variable PAGES_DEPLOY is "true", Pages uses
#   "GitHub Actions" as its source and the github-pages environment allows
#   v* tags (by default it only allows the default branch).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (nothing is pushed, published or deployed)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: A real release comes from a tag
        if: env.DRY_RUN != 'true' && github.ref_type != 'tag'
        run: |
          echo "::error::A release runs from a vX.Y.Z tag; run it by hand from the tag, or as a dry run."
          exit 1

      - uses: actions/checkout@v4

      - name: The tag is the version of ray-elements.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ray-elements.toml)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match ray-elements.toml's version ($version)."
            exit 1
          fi

      - name: Install raylang
        run: |
          curl -sSfL https://raylang.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool tests
        working-directory: tools
        run: ray test

      - name: raylang package tests
        working-directory: elements
        run: ray test

      # Served at /<repo>/ on GitHub Pages; a custom domain would be "/".
      - name: Build the site
        run: tools/run.sh site --base "${PAGES_BASE:-/${{ github.event.repository.name }}/}"
        env:
          PAGES_BASE: ${{ vars.PAGES_BASE }}

      - name: Committed output matches the sources
        run: |
          paths="docs packages dist src/index.js elements"
          if ! git diff --quiet -- $paths || [ -n "$(git status --porcelain -- $paths)" ]; then
            echo "::error::The generated files differ from what the sources produce. Run 'tools/run.sh build' and commit the result."
            git status --short -- $paths
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # packages/ as an app uses them: small bundles take only what they use
      # (esbuild), and the declarations compile (tsc).
      - name: Package checks
        run: |
          npm --prefix tests/packages ci
          npm --prefix tests/packages run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: |
          npm install -g npm@11
          npm --version

      # packages/ is what check compared with the sources. A version npm
      # already has is skipped, so a failed run can be run again; a
      # prerelease (0.4.0-rc.1) goes to the "next" dist-tag.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLIC: ${{ !github.event.repository.private }}
        run: |
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          [ "$PUBLIC" = "true" ] && flags+=(--provenance)
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Authenticating with NPM_TOKEN."
          else
            echo "No NPM_TOKEN: trusted publishing."
          fi
          for dir in elements react vue; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm: skipped."
              continue
            fi
            echo "Publishing $name@$version to $tag$([ "$DRY_RUN" = "true" ] && echo " (dry run)")"
            (cd "packages/$dir" && npm publish --tag "$tag" "${flags[@]}")
          done

  site:
    needs: check
    if: vars.PAGES_DEPLOY == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
