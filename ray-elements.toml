# Package metadata of the generated npm packages (packages/*).
# `tools/run.sh package` writes @raylang/elements, @raylang/react
# and @raylang/vue with this version.

[package]
scope = "@raylang"
version = "0.4.1"
description = "Web components for any app, with raylang extras (shadcn/ui + Mantine inspired)"
license = "Apache-2.0"
# The source repository (each package names its directory in it) and the
# page npm links as the homepage.
repository = "https://github.com/ray-language/ray-elements"
homepage = "https://github.com/ray-language/ray-elements#readme"
