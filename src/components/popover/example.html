<div class="demo-row">
  <ray-popover placement="bottom-start" width="280" trap-focus aria-label="Share">
    <ray-button slot="trigger" variant="default">Share</ray-button>
    <div style="display: grid; gap: 0.75rem">
      <ray-input label="Invite by email" placeholder="you@example.com" size="xs"></ray-input>
      <ray-button size="xs">Send invite</ray-button>
    </div>
  </ray-popover>
  <ray-popover placement="right">
    <ray-button slot="trigger" variant="light">Right side</ray-button>
    <p style="margin: 0; font-size: var(--ray-font-size-sm)">Flips and shifts to stay on screen.</p>
  </ray-popover>
</div>
