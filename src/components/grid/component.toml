[component]
name = "Grid"
category = "Layout"
summary = "A responsive grid: a column count per width (cols=\"1 sm:2 lg:4\") measured on the grid itself, or as many columns of a minimum width as fit. Children span columns with data-span."
files = ["grid.js"]
requires = []
tags = ["ray-grid"]

[ray-grid]
class = "RayGrid"
extends = "RayElement"
summary = "The widths are the grid's own (container queries: xs 36em, sm 48em, md 62em, lg 75em, xl 88em), so a grid in a narrow column or a phone frame drops to fewer columns. It needs a width from its parent: in a flex row give it one or let it grow. A child spans with data-span=\"2\"…\"12\" or \"full\"."

[ray-grid.properties.cols]
type = "string"
default = "1"
reflect = true
description = "Columns: a count, then counts from a width up (\"1 sm:2 lg:4\")."

[ray-grid.properties.minColWidth]
attribute = "min-col-width"
type = "string"
description = "Instead of cols: as many columns of at least this width as fit (\"14rem\", 220)."

[ray-grid.properties.gap]
type = "string"
default = "md"
reflect = true
description = "Space between cells: xs…xl, a number (px) or a CSS length."

[ray-grid.properties.rowGap]
attribute = "row-gap"
type = "string"
description = "Space between rows when it differs from gap."

[ray-grid.properties.align]
type = "string"
values = ["stretch", "start", "center", "end"]
default = "stretch"
reflect = true
description = "Vertical alignment of the cells in a row."

[ray-grid.slots.default]
description = "The cells (data-span=\"2\" or \"full\" to span)."

[ray-grid.parts.grid]
description = "The grid element."

[component.exports.parseCols]
ts = "function parseCols(value: string | number | undefined): { base?: number; xs?: number; sm?: number; md?: number; lg?: number; xl?: number }"
description = "\"1 sm:2 lg:4\" as counts per width."

[component.exports.BREAKPOINTS]
ts = "const BREAKPOINTS: { xs: string; sm: string; md: string; lg: string; xl: string }"
description = "The widths of cols (36em, 48em, 62em, 75em, 88em)."
