[component]
name = "Code"
category = "Data display"
summary = "A block of source code: header with file name and language, copy button, line numbers, highlighted lines, diff lines, wrapping and a \"show more\" height. A small built-in highlighter, or any library through setHighlighter(), painted with the --ray-code-* tokens."
files = ["code.js"]
requires = []
tags = ["ray-code"]

[component.exports.setHighlighter]
ts = "function setHighlighter(fn: ((code: string, lang: string) => string | Node | null | undefined | Promise<string | Node | null | undefined>) | null): void"
description = "Hands every ray-code to a highlighter that returns HTML (Prism, highlight.js, Shiki…); null/undefined falls back to the built-in one. The HTML is inserted as is: pass only a trusted highlighter. null restores the built-in one."

[component.exports.tokenize]
ts = "function tokenize(code: string, lang?: string): [type: string, text: string][]"
description = "The built-in highlighter: tokens of type keyword, string, number, comment, function, type, tag, attr, punctuation or text."

[ray-code]
class = "RayCode"
extends = "RayElement"
summary = "The code comes from the code property, a <script type=\"text/plain\"> child (raw text: anything but a closing script tag), a <template> child (parsed as HTML: the easiest for markup, but a < that is not a tag, as in Promise<void>, breaks it), or the element's text; common indentation and blank edges are removed. Built-in languages: js/ts (jsx, tsx), json, html/xml/svg/vue, css, shell, ray and diff; others show as plain text. Library classes painted with the tokens: Prism's .token.*, highlight.js's .hljs-*, and Shiki's css-variables theme."

[ray-code.properties.code]
attribute = false
type = "string"
description = "The code, from script (the most convenient in React and Vue). Wins over the content."

[ray-code.properties.lang]
type = "string"
reflect = true
description = "The language: js, ts, jsx, tsx, json, html, xml, svg, vue, css, sh, ray, diff… (also shown in the header)."

[ray-code.properties.filename]
type = "string"
description = "A file name or title in the header; also the scroll region's accessible name."

[ray-code.properties.lineNumbers]
attribute = "line-numbers"
type = "boolean"
reflect = true
description = "Numbers each line (not copied, not selectable)."

[ray-code.properties.highlight]
type = "string"
description = "Lines to highlight: \"3, 5-7\"."

[ray-code.properties.wrap]
type = "boolean"
reflect = true
description = "Wraps long lines instead of scrolling sideways."

[ray-code.properties.maxHeight]
attribute = "max-height"
type = "string"
description = "Height before it scrolls: px as a number, or a CSS length. A taller block gets a \"Show all N lines\" button."

[ray-code.properties.expanded]
type = "boolean"
reflect = true
description = "Shown whole, past max-height."

[ray-code.properties.hideCopy]
attribute = "hide-copy"
type = "boolean"
reflect = true
description = "No copy button."

[ray-code.properties.hideHeader]
attribute = "hide-header"
type = "boolean"
reflect = true
description = "No header bar (the copy button floats in the corner)."

[ray-code.properties.size]
type = "string"
values = ["xs", "sm", "md"]
default = "sm"
reflect = true
description = "Font size."

[ray-code.properties.radius]
type = "string"
reflect = true
description = "Corner radius: xs…xl, none, or a CSS length. Default: md."

[ray-code.properties.copyLabel]
attribute = "copy-label"
type = "string"
default = "Copy code"
description = "Accessible name of the copy button."

[ray-code.properties.copiedLabel]
attribute = "copied-label"
type = "string"
default = "Copied"
description = "Shown and announced after copying."

[ray-code.events.ray-copy]
detail = "{ code: string }"
description = "The code was copied."

[ray-code.slots.default]
description = "The code: text, a <template> or a <script type=\"text/plain\">."

[ray-code.parts.frame]
description = "The box."

[ray-code.parts.header]
description = "The bar with the file name, the language and the copy button."

[ray-code.parts.copy]
description = "The copy button."

[ray-code.parts.scroller]
description = "The scroll box (focusable, to scroll with the keyboard)."

[ray-code.parts.code]
description = "The <code> with one .line per line."

[ray-code.members.source]
ts = "readonly source: string"
description = "The code shown (dedented), whatever its source."

[ray-code.members.copy]
ts = "copy(): Promise<boolean>"
description = "Copies the code; resolves to true when it worked."
