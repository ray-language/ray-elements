[component]
name = "Command palette"
category = "Overlays"
summary = "Search and run actions from the keyboard (Mantine's Spotlight): fuzzy search, groups, shortcuts, ⌘K / Ctrl+K; combobox + listbox pattern in a modal dialog."
files = ["command-palette.js"]
requires = []
tags = ["ray-command-palette"]

[ray-command-palette]
class = "RayCommandPalette"
extends = "RayElement"
summary = "Running an action fires ray-select and calls its onSelect. The best matches come first, grouped."

[component.types.CommandAction]
ts = "{ id?: string; label: string; description?: string; group?: string; keywords?: string | string[]; shortcut?: string; icon?: string | Node; prefix?: string | Node; disabled?: boolean; native?: boolean; tag?: string; onSelect?: (action: CommandAction) => void }"
description = "An action of ray-command-palette. icon is a 1.25rem square (a registered icon name, text or a Node); prefix is content of any width before the label (text or a Node, e.g. a ray-badge with an HTTP method), not searched."

[component.exports.score]
ts = "function score(action: CommandAction, query: string): number"
description = "How well an action matches a query (0 = not at all)."

[ray-command-palette.properties.open]
type = "boolean"
reflect = true
description = "Shown."

[ray-command-palette.properties.actions]
attribute = false
type = "array"
ts = "CommandAction[]"
description = "The actions."

[ray-command-palette.properties.query]
type = "string"
default = ""
description = "The search text."

[ray-command-palette.properties.placeholder]
type = "string"
default = "Search commands…"
description = "Placeholder of the search field."

[ray-command-palette.properties.hotkey]
type = "string"
default = "mod+k"
description = "Toggle shortcut (mod = ⌘ on macOS, Ctrl elsewhere); empty to disable."

[ray-command-palette.properties.limit]
type = "number"
default = "50"
description = "Maximum results."

[ray-command-palette.properties.emptyLabel]
attribute = "empty-label"
type = "string"
default = "Nothing found"
description = "Text without results."

[ray-command-palette.properties.label]
type = "string"
default = "Command palette"
description = "Accessible name."

[ray-command-palette.properties.hideHint]
attribute = "hide-hint"
type = "boolean"
reflect = true
description = "No keyboard hint at the bottom."

[ray-command-palette.properties.navigateLabel]
attribute = "navigate-label"
type = "string"
default = "navigate"
description = "The keyboard hint's word for ↑↓."

[ray-command-palette.properties.runLabel]
attribute = "run-label"
type = "string"
default = "run"
description = "The keyboard hint's word for ↵."

[ray-command-palette.properties.closeLabel]
attribute = "close-label"
type = "string"
default = "close"
description = "The keyboard hint's word for esc."

[ray-command-palette.properties.nativeMenus]
attribute = "native-menus"
type = "boolean"
reflect = true
description = "With a native host (ray-elements/core/raylang.js in a std/ui window, menus declared with elements/bridge), also lists the app's menu bar, grouped by menu with its shortcuts; running one gives the program the menu's own event."

[ray-command-palette.properties.overlayBlur]
attribute = "overlay-blur"
type = "string"
description = "Blur of the page behind: px (\"8\"), a CSS length or \"none\". Default: --ray-overlay-blur ([overlay] blur in tokens.toml)."

[ray-command-palette.events.ray-select]
description = "An action was run."
detail = "{ action: CommandAction }"

[ray-command-palette.events.ray-open]
description = "After it opened."

[ray-command-palette.events.ray-close]
description = "After it closed."

[ray-command-palette.parts.dialog]
description = "The dialog."

[ray-command-palette.parts.input]
description = "The search field."

[ray-command-palette.parts.option]
description = "Each result."

[ray-command-palette.members.show]
ts = "show(): void"
description = "Opens it."

[ray-command-palette.members.hide]
ts = "hide(): void"
description = "Closes it."

[ray-command-palette.members.toggle]
ts = "toggle(): void"
description = "Opens or closes it."

[ray-command-palette.members.results]
ts = "readonly results: CommandAction[]"
description = "The actions matching the query, in display order."

[ray-command-palette.model]
property = "open"
events = ["ray-open", "ray-close"]
