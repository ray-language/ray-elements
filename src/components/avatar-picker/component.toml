[component]
name = "Avatar picker"
category = "Inputs"
summary = "A profile picture field: a ray-avatar (the initials of display-name without a picture), Choose photo / Change photo and Remove photo, and a sheet with a ray-image-crop to frame the chosen image in a circle before it is kept. A bottom drawer on a narrow screen, a dialog otherwise. The value is the framed picture as a data URL, or a Blob with output=\"blob\"; it takes part in a <form>."
files = ["avatar-picker.js"]
requires = ["avatar", "button", "image-crop", "drawer", "dialog"]
tags = ["ray-avatar-picker"]
aliases = ["Profile picture", "Photo picker"]

[ray-avatar-picker]
class = "RayAvatarPicker"
extends = "FormControl"
summary = "Choose photo opens the system picker (on a phone, the camera or the photo library); the chosen image opens in the sheet, framed in a circle, and Use photo makes the framed part, at output-size, the value. Cancel or a picture that cannot be decoded leaves the value as it was (the latter shows failed-label and fires ray-error). edit(file) opens the sheet on an image from elsewhere (a drop, a paste). Styling: the parts, and ::part(crop) for --ray-image-crop-* ."

[ray-avatar-picker.properties.name]
type = "string"
reflect = true
description = "Form field name. The value is submitted as a string (data URL) or, with output=\"blob\", as a file named <name>.jpg (.png, .webp)."

[ray-avatar-picker.properties.value]
type = "string"
ts = "string | Blob | null"
description = "The picture: a URL or data URL (the value attribute: the initial picture, and what a form reset goes back to), or a Blob. null without one."

[ray-avatar-picker.properties.output]
type = "string"
values = ["dataurl", "blob"]
default = "dataurl"
reflect = true
description = "What Use photo makes the value: a data URL (easy to keep in JSON) or a Blob (to upload)."

[ray-avatar-picker.properties.label]
type = "string"
description = "Label above the avatar and the buttons."

[ray-avatar-picker.properties.description]
type = "string"
description = "Help text under the label."

[ray-avatar-picker.properties.error]
type = "string"
description = "Error message; marks the field invalid."

[ray-avatar-picker.properties.required]
type = "boolean"
reflect = true
description = "A picture is required to submit the form."

[ray-avatar-picker.properties.disabled]
type = "boolean"
reflect = true
description = "No choosing, removing nor preview (also inside a disabled <fieldset>)."

[ray-avatar-picker.properties.readonly]
type = "boolean"
reflect = true
description = "The picture cannot be changed: the buttons are hidden, the preview still works. Not validated (required does not apply), as a native readonly field."

[ray-avatar-picker.properties.displayName]
attribute = "display-name"
type = "string"
description = "The person's name: the avatar shows its initials without a picture (name is the form field)."

[ray-avatar-picker.properties.accept]
type = "string"
default = "image/*"
description = "File types the picker offers."

[ray-avatar-picker.properties.size]
type = "string"
values = ["xs", "sm", "md", "lg", "xl"]
default = "xl"
reflect = true
description = "Size of the avatar."

[ray-avatar-picker.properties.color]
type = "string"
description = "Color of the avatar's initials (a palette color or any CSS color)."

[ray-avatar-picker.properties.variant]
type = "string"
values = ["light", "filled", "outline", "default"]
default = "light"
description = "Style of the avatar's initials."

[ray-avatar-picker.properties.radius]
type = "string"
values = ["xs", "sm", "md", "lg", "xl", "full"]
description = "Corner radius of the avatar. Default: full (the crop frames a circle either way; the picture is square)."

[ray-avatar-picker.properties.buttonSize]
attribute = "button-size"
type = "string"
values = ["xs", "sm", "md", "lg", "xl"]
default = "sm"
description = "Size of the buttons."

[ray-avatar-picker.properties.layout]
type = "string"
values = ["stack", "inline"]
default = "stack"
reflect = true
description = "The buttons one under the other, beside the avatar, or in a row."

[ray-avatar-picker.properties.sheet]
type = "string"
values = ["auto", "drawer", "dialog"]
default = "auto"
reflect = true
description = "Where the crop opens: auto is a bottom drawer on a narrow screen (up to 40em) and a dialog otherwise."

[ray-avatar-picker.properties.outputSize]
attribute = "output-size"
type = "string"
ts = "string | number"
default = "320"
description = "Side of the square picture kept, in pixels."

[ray-avatar-picker.properties.type]
type = "string"
default = "image/jpeg"
ts = "\"image/jpeg\" | \"image/png\" | \"image/webp\" | (string & {})"
description = "Format of the picture kept (PNG where the browser cannot encode it)."

[ray-avatar-picker.properties.quality]
type = "number"
default = "0.85"
description = "0…1, for image/jpeg and image/webp."

[ray-avatar-picker.properties.maxZoom]
attribute = "max-zoom"
type = "number"
default = "4"
description = "The most zoom of the crop."

[ray-avatar-picker.properties.pickLabel]
attribute = "pick-label"
type = "string"
default = "Choose photo"
description = "The button without a picture."

[ray-avatar-picker.properties.changeLabel]
attribute = "change-label"
type = "string"
default = "Change photo"
description = "The same button with a picture."

[ray-avatar-picker.properties.removeLabel]
attribute = "remove-label"
type = "string"
default = "Remove photo"
description = "The button that removes the picture."

[ray-avatar-picker.properties.sheetLabel]
attribute = "sheet-label"
type = "string"
default = "Adjust the photo"
description = "Title of the crop sheet."

[ray-avatar-picker.properties.useLabel]
attribute = "use-label"
type = "string"
default = "Use photo"
description = "The sheet's button that keeps the framed picture."

[ray-avatar-picker.properties.cancelLabel]
attribute = "cancel-label"
type = "string"
default = "Cancel"
description = "The sheet's button that leaves the value as it was."

[ray-avatar-picker.properties.cropLabel]
attribute = "crop-label"
type = "string"
default = "Photo framing"
description = "Accessible name of the crop area."

[ray-avatar-picker.properties.zoomLabel]
attribute = "zoom-label"
type = "string"
default = "Zoom"
description = "Name of the zoom slider."

[ray-avatar-picker.properties.preview]
type = "boolean"
reflect = true
description = "With a picture, the avatar is a button (click, Enter, Space): it fires ray-preview and, unless that is canceled, shows the picture large in a dialog. Also with readonly; not while disabled."

[ray-avatar-picker.properties.previewLabel]
attribute = "preview-label"
type = "string"
default = "View photo"
description = "Accessible name of the avatar button and title of the preview dialog."

[ray-avatar-picker.properties.requiredLabel]
attribute = "required-label"
type = "string"
default = "Please choose a photo."
description = "Validation message of required without a picture."

[ray-avatar-picker.properties.failedLabel]
attribute = "failed-label"
type = "string"
default = "That image could not be opened."
description = "Shown under the field when the chosen file cannot be decoded, or the framed picture encoded (until the next picture)."

[ray-avatar-picker.members.pick]
ts = "pick(): void"
description = "Opens the system picker (what Choose photo does)."

[ray-avatar-picker.members.edit]
ts = "edit(src: Blob | string): void"
description = "Opens the crop sheet on an image (a File, Blob or URL); Use photo makes it the value."

[ray-avatar-picker.members.showPreview]
ts = "showPreview(): void"
description = "Shows the picture large in a dialog (nothing without one, or while disabled)."

[ray-avatar-picker.members.clear]
ts = "clear(): void"
description = "Removes the picture (fires input and change when there was one)."

[ray-avatar-picker.members.toBlob]
ts = "toBlob(): Promise<Blob | null>"
description = "The value as a Blob whatever output is (null without a picture). A URL value is fetched: a cross-origin one needs CORS, and a data URL needs a Content-Security-Policy whose connect-src allows data:."

[ray-avatar-picker.events.input]
description = "The value changed (fired with change)."

[ray-avatar-picker.events.change]
description = "A picture was kept (Use photo) or removed. Read value."

[ray-avatar-picker.events.ray-preview]
detail = "{ value: string | Blob }"
description = "The avatar was pressed (with preview and a picture). Cancelable: preventDefault() to do something else than the preview dialog (a menu, an app's own viewer)."

[ray-avatar-picker.events.ray-error]
detail = "{ error: Error }"
description = "The chosen file could not be decoded, or the framed picture encoded; the value is unchanged."

[ray-avatar-picker.parts.label]
description = "The label."

[ray-avatar-picker.parts.description]
description = "The description."

[ray-avatar-picker.parts.row]
description = "The avatar and the buttons (role group, named by the label)."

[ray-avatar-picker.parts.view]
description = "Around the avatar; a button with preview and a picture."

[ray-avatar-picker.parts.avatar]
description = "The ray-avatar."

[ray-avatar-picker.parts.actions]
description = "The buttons' column (or row)."

[ray-avatar-picker.parts.pick]
description = "The Choose photo / Change photo ray-button."

[ray-avatar-picker.parts.remove]
description = "The Remove photo ray-button."

[ray-avatar-picker.parts.error]
description = "The error message."

[ray-avatar-picker.parts.sheet]
description = "The ray-drawer or ray-dialog of the crop."

[ray-avatar-picker.parts.crop]
description = "The ray-image-crop."

[ray-avatar-picker.parts.preview]
description = "The ray-dialog of the preview."

[ray-avatar-picker.parts.preview-image]
description = "The picture in the preview dialog."

[ray-avatar-picker.parts.cancel]
description = "The sheet's Cancel ray-button."

[ray-avatar-picker.parts.use]
description = "The sheet's Use photo ray-button."

[ray-avatar-picker.model]
property = "value"
events = ["change"]
