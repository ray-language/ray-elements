[component]
name = "Bottom nav"
category = "Navigation"
summary = "The bottom navigation of a phone app (Material's navigation bar, the iOS tab bar): three to five destinations with an icon, a label and a badge, the current one marked by a pill. Links or a value; an action button in the middle; hides on scroll."
files = ["bottom-nav.js"]
requires = []
tags = ["ray-bottom-nav", "ray-bottom-nav-item"]

[ray-bottom-nav]
class = "RayBottomNav"
extends = "RayElement"
summary = "With href items it marks the link to this page (aria-current=\"page\"); without, it is a control (value, change). Clear of the home indicator (safe-area inset). In a ray-app-shell, put it in the bottom slot."

[ray-bottom-nav.properties.value]
type = "string"
reflect = true
description = "The current destination (an item's value, else its href, else its label)."

[ray-bottom-nav.properties.label]
type = "string"
default = "Main"
description = "Accessible name of the navigation."

[ray-bottom-nav.properties.labels]
type = "string"
values = ["always", "active", "never"]
default = "always"
reflect = true
description = "Which labels show (the others stay for assistive technology)."

[ray-bottom-nav.properties.indicator]
type = "string"
values = ["pill", "line", "none"]
default = "pill"
reflect = true
description = "How the current destination is marked besides its color."

[ray-bottom-nav.properties.color]
type = "string"
reflect = true
description = "A palette color or any CSS color for the current item and the action (default: primary)."

[ray-bottom-nav.properties.variant]
type = "string"
values = ["default", "floating"]
default = "default"
reflect = true
description = "default: a bar across the bottom; floating: a rounded bar off the edges."

[ray-bottom-nav.properties.hideOnScroll]
attribute = "hide-on-scroll"
type = "boolean"
reflect = true
description = "Slides away while the content scrolls down, back on the way up."

[ray-bottom-nav.properties.fixed]
type = "boolean"
reflect = true
description = "Pinned to the bottom of the window (outside a shell)."

[ray-bottom-nav.properties.scrollTarget]
attribute = "scroll-target"
type = "string"
description = "A selector of the element whose scrolling it follows (default: its shell's, else the window)."

[ray-bottom-nav.events.change]
description = "The user picked another destination (read value)."

[ray-bottom-nav.events.ray-select]
detail = "{ value: string }"
description = "An action item was pressed."

[ray-bottom-nav.slots.default]
description = "ray-bottom-nav-item elements (3 to 5)."

[ray-bottom-nav.parts.nav]
description = "The <nav>."

[ray-bottom-nav.members.items]
ts = "readonly items: RayBottomNavItem[]"
description = "The items, in order."

[ray-bottom-nav.model]
property = "value"
events = ["change"]

[ray-bottom-nav-item]
class = "RayBottomNavItem"
extends = "RayElement"
summary = "A link with href, else a button. The badge is read with the label (\"Messages, 3\")."

[ray-bottom-nav-item.properties.value]
type = "string"
reflect = true
description = "Its value (default: its href, else its label)."

[ray-bottom-nav-item.properties.label]
type = "string"
description = "The label."

[ray-bottom-nav-item.properties.icon]
type = "string"
ts = "IconName"
description = "An icon of the registry (or put one in the icon slot)."

[ray-bottom-nav-item.properties.href]
type = "string"
reflect = true
description = "Makes it a link."

[ray-bottom-nav-item.properties.badge]
type = "string"
description = "A count or a short text on the icon."

[ray-bottom-nav-item.properties.dot]
type = "boolean"
reflect = true
description = "A dot on the icon (something new)."

[ray-bottom-nav-item.properties.active]
type = "boolean"
reflect = true
description = "Set by the bar: the current destination."

[ray-bottom-nav-item.properties.disabled]
type = "boolean"
reflect = true
description = "Not interactive."

[ray-bottom-nav-item.properties.action]
type = "boolean"
reflect = true
description = "A raised round button (\"New\"): it fires ray-select on the bar, it is not a destination."

[ray-bottom-nav-item.slots.icon]
description = "A custom icon (a ray-icon, an svg, an avatar)."

[ray-bottom-nav-item.parts.item]
description = "The link or button."

[ray-bottom-nav-item.parts.indicator]
description = "The pill behind the icon."

[ray-bottom-nav-item.parts.badge]
description = "The badge."

[ray-bottom-nav-item.parts.label]
description = "The label."
