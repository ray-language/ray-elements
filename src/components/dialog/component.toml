[component]
name = "Dialog"
category = "Overlays"
summary = "A modal dialog on the native <dialog>: top layer, rest of the page inert, focus moved in and restored. Also exports confirmDialog()."
files = ["dialog.js"]
requires = ["button"]
tags = ["ray-dialog"]

[ray-dialog]
class = "RayDialog"
summary = "Any slotted element with data-dialog-close closes it (its value becomes returnValue). JS: show(), close(returnValue), confirmDialog({ label, message, confirmLabel, cancelLabel, color }) -> Promise<boolean>."
extends = "RayElement"

[ray-dialog.properties.open]
type = "boolean"
reflect = true
description = "Shown as a modal."

[ray-dialog.properties.label]
type = "string"
description = "Heading (also the dialog's accessible name)."

[ray-dialog.properties.size]
type = "string"
values = ["xs", "sm", "md", "lg", "xl", "full"]
default = "md"
reflect = true
description = "Width."

[ray-dialog.properties.position]
type = "string"
values = ["center", "top"]
default = "center"
reflect = true
description = "Vertical placement."

[ray-dialog.properties.persistent]
type = "boolean"
reflect = true
description = "Escape and backdrop clicks do not close it."

[ray-dialog.properties.hideClose]
attribute = "hide-close"
type = "boolean"
reflect = true
description = "No close button in the header."

[ray-dialog.properties.overlayBlur]
attribute = "overlay-blur"
type = "string"
description = "Blur of the page behind: px (\"8\"), a CSS length or \"none\". Default: --ray-overlay-blur ([overlay] blur in tokens.toml)."

[ray-dialog.events.ray-open]
description = "After it opened."

[ray-dialog.events.ray-close]
description = "After it closed; detail: { returnValue }."
detail = "{ returnValue: string }"

[ray-dialog.events.ray-request-close]
description = "Escape, backdrop or close button; cancelable (preventDefault keeps it open). detail: { source }."
detail = '{ source: "escape" | "backdrop" | "button" }'

[ray-dialog.slots.default]
description = "Body."

[ray-dialog.slots.header]
description = "Extra header content, next to the title."

[ray-dialog.slots.footer]
description = "Actions, aligned to the end."

[ray-dialog.parts.dialog]
description = "The native <dialog>."

[ray-dialog.parts.title]
description = "The heading."

[ray-dialog.parts.body]
description = "The scrollable body."

[ray-dialog.parts.footer]
description = "The footer."

[ray-dialog.parts.close]
description = "The close button."

[ray-dialog.model]
property = "open"
events = ["ray-open", "ray-close"]

[ray-dialog.members.show]
ts = "show(): void"
description = "Opens it."

[ray-dialog.members.close]
ts = "close(returnValue?: string): void"
description = "Closes it with an optional return value."

[ray-dialog.members.returnValue]
ts = "returnValue: string"
description = "The value it was closed with."

[component.types.ConfirmOptions]
ts = "{ label?: string; message?: string; confirmLabel?: string; cancelLabel?: string; color?: string }"
description = "Options of confirmDialog()."

[component.exports.confirmDialog]
ts = "function confirmDialog(options?: ConfirmOptions): Promise<boolean>"
description = "A confirmation dialog; resolves true when confirmed."
