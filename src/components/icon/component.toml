[component]
name = "Icon"
category = "Data display"
summary = "An icon of the registry: the whole set (the components' too) changes with setIcons()."
files = ["icon.js"]
requires = []
tags = ["ray-icon"]

[component.types.IconName]
description = "An icon name: one of the default set, or any name an app registers with setIcons()."

[ray-icon]
class = "RayIcon"
extends = "RayElement"
summary = "setIcons({ name: '<svg…>' }) replaces or adds icons (SVG markup or an SVGElement, drawn with currentColor); iconNames() lists them. An icon may have a filled version for a state (filled; \"<name>:filled\" in setIcons; iconNames({ filled: true }) lists them). The components draw roles (\"ui.close\", \"ui.remove\", \"ui.expand\"…; iconAliases()), each its glyph until the app registers the role: setIcons({ \"ui.remove\": … }) changes only the chips' ×. Sizes follow the font unless size; --ray-icon-size and --ray-icon-stroke tune the whole system."

[ray-icon.properties.name]
type = "string"
reflect = true
ts = "IconName"
description = "Registered icon name (iconNames()); \"none\" draws nothing, a blank that keeps the alignment (a menu item without its check)."

[ray-icon.properties.filled]
type = "boolean"
reflect = true
description = "The filled version, for a state (active, selected, favorite, unread); the outline icon when there is none. Built in: user, info, circle-check, alert-triangle, circle-x, folder, bell, star, settings, home, message-circle."

[ray-icon.properties.mirror]
type = "boolean"
reflect = true
description = "Mirrored in a right-to-left context (dir=\"rtl\"), for an icon that points along the text: back, forward, send, undo. The roles that do (ui.next, ui.previous, ui.first, ui.last, ui.disclosure, ui.separator) mirror by themselves."

[ray-icon.properties.size]
type = "string"
reflect = true
description = "xs…xl or any CSS length. Default: 1em."

[ray-icon.properties.label]
type = "string"
description = "Accessible name; without it the icon is decorative (hidden from screen readers)."

[ray-icon.properties.color]
type = "string"
reflect = true
description = "A palette color or any CSS color. Default: the text color."

[ray-icon.properties.stroke]
type = "number"
description = "Stroke width for stroke icons (default: --ray-icon-stroke, 2)."

[ray-icon.parts.icon]
description = "The icon box."
