<div class="demo-row" style="font-size: 1.25rem">
  <ray-icon name="info" color="blue" label="Information"></ray-icon>
  <ray-icon name="circle-check" color="green"></ray-icon>
  <ray-icon name="alert-triangle" color="yellow"></ray-icon>
  <ray-icon name="circle-x" color="red"></ray-icon>
  <ray-icon name="search" size="xl" stroke="1.5"></ray-icon>
  <ray-button variant="default"><ray-icon slot="left" name="plus"></ray-icon>New</ray-button>
  <ray-button id="demo-icons-swap" variant="light">Swap the icon set</ray-button>
</div>
<p style="margin: 0; font-size: var(--ray-font-size-sm); color: var(--ray-muted-foreground)">Registered: <code id="demo-icon-names"></code></p>
<script type="module">
  import { setIcons, iconNames } from "../src/core/core.js";
  document.getElementById("demo-icon-names").textContent = iconNames().join(", ");
  // A "filled" set, to show every component (dialog close, select chevron…) following it.
  const solid = (d) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
  document.getElementById("demo-icons-swap").addEventListener("click", () => setIcons({
    "info": solid("M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"),
    "circle-check": solid("M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.5 14.5-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z"),
    "plus": solid("M11 5h2v14h-2zM5 11h14v2H5z"),
    "chevron-down": solid("M7 9h10l-5 6z"),
  }));
</script>
