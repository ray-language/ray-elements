[component]
name = "Container"
category = "Layout"
summary = "Its content centered, up to a maximum width, with side padding (Mantine's Container): the column of a page."
files = ["container.js"]
requires = []
tags = ["ray-container"]

[ray-container]
class = "RayContainer"
extends = "RayElement"

[ray-container.properties.size]
type = "string"
default = "md"
reflect = true
description = "Maximum width: xs 540px, sm 720px, md 960px, lg 1140px, xl 1320px, or any CSS length."

[ray-container.properties.padding]
type = "string"
default = "md"
reflect = true
description = "Side padding: xs…xl, a number (px) or a CSS length."

[ray-container.properties.fluid]
type = "boolean"
reflect = true
description = "No maximum width: the whole width, still padded."

[ray-container.slots.default]
description = "The content."

[component.exports.CONTAINER_SIZES]
ts = "const CONTAINER_SIZES: { xs: string; sm: string; md: string; lg: string; xl: string }"
description = "The maximum widths of size."
