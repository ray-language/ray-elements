[component]
name = "Slider"
category = "Inputs"
summary = "A native range input (keyboard, touch and screen readers as usual) with label, value display and marks; horizontal or vertical (a fader), with a round thumb or a mixing desk's cap (and a fader's gestures), linear or on a fader's dB curve. Form-associated."
aliases = ["Range", "Fader"]
files = ["slider.js"]
requires = []
tags = ["ray-slider"]

[ray-slider]
class = "RaySlider"
extends = "FieldControl"

[ray-slider.properties.value]
type = "number"
description = "Current value. The value attribute is the initial one (restored on reset)."

[ray-slider.properties.min]
type = "number"
default = "0"
description = "Minimum."

[ray-slider.properties.max]
type = "number"
default = "100"
description = "Maximum."

[ray-slider.properties.step]
type = "number"
default = "1"
description = "Step."

[ray-slider.properties.name]
type = "string"
description = "Form field name."

[ray-slider.properties.label]
type = "string"
description = "Visible label."

[ray-slider.properties.description]
type = "string"
description = "Help text."

[ray-slider.properties.descriptionPosition]
attribute = "description-position"
type = "string"
values = ["above", "below"]
default = "above"
reflect = true
description = "The description before the control (help first) or after it, with the error (fields in a row stay aligned)."

[ray-slider.properties.error]
type = "string"
description = "Error text."

[ray-slider.properties.disabled]
type = "boolean"
description = "Not interactive nor submitted."

[ray-slider.properties.color]
type = "string"
reflect = true
description = "Track and thumb color."

[ray-slider.properties.size]
type = "string"
values = ["xs", "sm", "md", "lg", "xl"]
default = "sm"
reflect = true
description = "Track and thumb size."

[ray-slider.properties.showValue]
attribute = "show-value"
type = "boolean"
reflect = true
description = "Shows the value next to the label."

[ray-slider.properties.unit]
type = "string"
description = "Appended to the shown value and its spoken text (%, px, ms…)."

[ray-slider.properties.marks]
attribute = false
type = "array"
ts = "Array<number | { value: number; label?: string }>"
description = "Labeled ticks under the track."

[ray-slider.properties.orientation]
type = "string"
values = ["horizontal", "vertical"]
default = "horizontal"
reflect = true
description = "vertical: a fader, the minimum at the bottom and the marks before the track (on the left, aligned against it); its length is the host's height (--ray-slider-length, 12rem by default). The arrow keys work as on a horizontal one (ArrowUp raises it)."

[ray-slider.properties.thumb]
type = "string"
values = ["round", "cap"]
default = "round"
reflect = true
description = "The thumb: round, or cap (a mixing desk's fader cap: a short, wide block with a line at its middle, over a plain slot). A cap also plays as a fader: a click on the slot does not move it, a drag moves it from where it is (Shift: ten times finer), the wheel steps it (Shift: ten steps), and the arrow keys with Shift take ten steps. Any other look: the --ray-slider-thumb-size (across the track), -length (along it), -background, -border, -radius and -shadow variables."

[ray-slider.properties.taper]
type = "string"
values = ["linear", "fader"]
default = "linear"
reflect = true
description = "How the values spread along the track. fader: dB on a mixing desk's curve (the fourth root of the gain, min at the bottom), so the range used to mix gets most of the travel: with -60…6, 0 dB at 81 %, -12 at 52 %, -24 at 32 %. The marks follow it; ray-meter taper=\"fader\" beside it lines up with them. A key or a wheel notch moves a hundredth of the travel (Shift: a tenth). The curve itself: taperPosition and taperValue from @raylang/elements/core."

[ray-slider.properties.defaultValue]
attribute = "default-value"
type = "number"
description = "What a double click returns to (a fader's 0 dB). Without it, the value attribute."

[ray-slider.events.input]
description = "While dragging."

[ray-slider.events.change]
description = "When released."

[ray-slider.parts.input]
description = "The native range input."

[ray-slider.model]
property = "value"
events = ["input"]
