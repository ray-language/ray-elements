[component]
name = "Pagination"
category = "Navigation"
summary = "Page navigation: previous/next, optional first/last, page numbers with ellipses; the number of items stays constant so it does not jump."
files = ["pagination.js"]
requires = []
tags = ["ray-pagination"]

[ray-pagination]
class = "RayPagination"
extends = "RayElement"
summary = "JS: setPage(n), next(), previous(), first(), last(); page (clamped value)."

[ray-pagination.properties.total]
type = "number"
default = "1"
description = "Number of pages."

[ray-pagination.properties.value]
type = "number"
default = "1"
description = "Current page (1-based)."

[ray-pagination.properties.siblings]
type = "number"
default = "1"
description = "Pages shown on each side of the current one."

[ray-pagination.properties.boundaries]
type = "number"
default = "1"
description = "Pages always shown at the start and the end."

[ray-pagination.properties.withEdges]
attribute = "with-edges"
type = "boolean"
reflect = true
description = "Adds first/last page buttons."

[ray-pagination.properties.hideControls]
attribute = "hide-controls"
type = "boolean"
reflect = true
description = "Hides the previous/next (and first/last) buttons."

[ray-pagination.properties.color]
type = "string"
reflect = true
description = "Color of the current page: a palette color or any CSS color. Default: the primary color."

[ray-pagination.properties.size]
type = "string"
values = ["xs", "sm", "md", "lg", "xl"]
default = "sm"
reflect = true
description = "Item size."

[ray-pagination.properties.radius]
type = "string"
values = ["xs", "sm", "md", "lg", "xl", "full"]
description = "Corner radius of the items."

[ray-pagination.properties.disabled]
type = "boolean"
reflect = true
description = "Not interactive."

[ray-pagination.properties.label]
type = "string"
default = "Pagination"
description = "Accessible name of the navigation landmark."

[ray-pagination.events.ray-change]
detail = "{ value: number }"
description = "The user went to another page (also fires `change`)."

[ray-pagination.events.change]
description = "The page changed."

[ray-pagination.parts.root]
description = "The <nav> landmark."

[ray-pagination.parts.list]
description = "The list of items."

[ray-pagination.parts.item]
description = "Every button (pages and controls)."

[ray-pagination.parts.active]
description = "The current page button."

[ray-pagination.parts.control]
description = "Previous/next/first/last buttons."

[ray-pagination.parts.dots]
description = "An ellipsis."

[ray-pagination.model]
property = "value"
events = ["change"]

[ray-pagination.members.page]
ts = "readonly page: number"
description = "The current page clamped to 1…total."

[ray-pagination.members.setPage]
ts = "setPage(page: number): void"
description = "Goes to a page (fires ray-change and change)."

[ray-pagination.members.next]
ts = "next(): void"
description = "Next page."

[ray-pagination.members.previous]
ts = "previous(): void"
description = "Previous page."

[ray-pagination.members.first]
ts = "first(): void"
description = "First page."

[ray-pagination.members.last]
ts = "last(): void"
description = "Last page."

[component.exports.paginationRange]
ts = "function paginationRange(total: number, value: number, siblings?: number, boundaries?: number): Array<number | \"dots\">"
description = "The items a pagination shows for a page (numbers and \"dots\")."
