[package]
name = "ray_ds"
version = "0.3.0"
description = "ray-ds for raylang apps: the npm package @ray-ds/elements served to the app's pages by its npm name ([web] package) and the native bridge for std/ui windows (ray_ds/bridge)"
license = "Apache-2.0"
raylang = "1.27.44"

# @ray-ds/elements, as published to npm: raylang serves it at
# ray://app/node_modules/@ray-ds/elements/ with an import map, bakes it into a
# native binary and links it into the app's node_modules/ for the editor.
[web]
package = "web"
